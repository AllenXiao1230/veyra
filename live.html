<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101216"><title>即時監看 · Camera Monitor</title>
  <link rel="stylesheet" href="/camera-ui.css?v=tuning1">
  <script src="/camera-ui.js?v=tuning1" defer></script>
  <script src="/camera-center.js?v=tuning1" defer></script>
  <script src="/camera-mobile.js?v=tuning1" defer></script>
  <script src="/camera-stream.js?v=tuning1" defer></script>
  <script src="/camera-live.js?v=tuning1" defer></script>
  <script src="/camera-connection.js?v=tuning1" defer></script>
</head>
<body data-page="live">
  <header class="app-header" id="appHeader"></header>
  <main class="home">
    <div class="page-heading">
      <h1>即時監看</h1>
      <span class="status" id="liveStatus" role="status"><span class="dot"></span><span>連線中</span></span>
    </div>
    <section class="connection-row" aria-label="伺服器連線狀況">
      <span class="status" id="serverConnection" role="status"><span class="dot"></span><span>正在確認伺服器連線</span></span>
      <span id="connectionMetrics" class="muted">穩定度從本頁開啟後開始觀測</span>
    </section>
    <section aria-label="攝影機即時影像">
      <div class="viewer" id="liveViewer">
        <img id="liveImage" alt="即時攝影機影像" decoding="async">
        <p class="viewer-message" id="viewerMessage">正在連接攝影機…</p>
        <div class="viewer-tools">
          <button class="icon-button" id="previewPause" type="button" aria-label="暫停預覽" title="暫停預覽" data-icon="pause"></button>
          <button class="icon-button" id="previewReconnect" type="button" aria-label="重新連線影像" title="重新連線" data-icon="refresh"></button>
          <button class="icon-button" id="previewFullscreen" type="button" aria-label="全螢幕" title="全螢幕" data-icon="expand"></button>
        </div>
      </div>
      <div class="record-bar">
        <div class="record-summary"><h2>錄影</h2><span id="recordStatus" class="status" role="status"><span class="dot"></span><span>讀取中</span></span></div>
        <button class="primary" id="recordToggle" type="button" disabled><span data-icon="record"></span><span>開始錄影</span></button>
      </div>
      <p class="notice" id="recordWarning" role="status" hidden></p>
    </section>
    <section class="audio-row" aria-label="音訊監聽">
      <span class="audio-icon" data-icon="volume"></span>
      <div class="audio-copy"><h2>音訊監聽</h2><p id="audioSummary">正在連接音訊…</p></div>
      <div class="audio-meter">
        <div class="audio-level" role="meter" aria-label="即時麥克風音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="讀取中"><span id="audioLevel"></span></div>
        <output id="audioLevelValue" aria-hidden="true">讀取中</output>
      </div>
      <button id="listenToggle" type="button"><span data-icon="volume"></span><span>開啟監聽</span></button>
      <p class="playback-status muted" id="playbackAudioStatus" role="status">播放聲音已關閉</p>
      <button id="audioReconnect" type="button" class="quiet">重新連接音畫</button>
    </section>
    <iframe class="audio-frame" id="micFrame" title="音訊播放器" allow="autoplay" tabindex="-1" aria-hidden="true"></iframe>
  </main>
</body>
</html>
