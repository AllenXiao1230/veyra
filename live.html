<style>

:root {

  color-scheme: dark;

  --bg:#101216; --panel:#191d24; --line:#2b313b;

  --text:#edf0f5; --muted:#969eab; --accent:#79a9ff;

  --red:#ff626b; --green:#60d6a1;

}

* { box-sizing:border-box; }

body {

  margin:0; background:var(--bg); color:var(--text);

  font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;

}

header {

  padding:20px clamp(16px,4vw,40px);

  border-bottom:1px solid var(--line);

  display:flex; justify-content:space-between; align-items:center;

  gap:12px; flex-wrap:wrap;

}

h1 { font-size:20px; margin:0; letter-spacing:.04em; }

h2 { font-size:17px; margin:0 0 16px; }

main {

  width:min(1200px,100%); margin:auto;

  padding:22px clamp(12px,3vw,28px) 48px;

}

.panel {

  background:var(--panel); border:1px solid var(--line);

  border-radius:14px; padding:18px; margin-bottom:18px;

}

.topline,.actions,.record-row {

  display:flex; align-items:center; justify-content:space-between;

  gap:12px; flex-wrap:wrap;

}

.status { color:var(--muted); font-size:13px; }

.dot {

  display:inline-block; width:8px; height:8px;

  background:var(--muted); border-radius:50%; margin-right:7px;

}

.dot.online { background:var(--green); }

.dot.offline { background:var(--red); }

button,.button {

  border:1px solid var(--line); border-radius:9px;

  background:#252b35; color:var(--text); padding:10px 14px;

  font:inherit; cursor:pointer; text-decoration:none;

}

button:hover,.button:hover { border-color:var(--accent); }

button:disabled { opacity:.45; cursor:not-allowed; }

.primary { background:#254a7b; border-color:#3b659a; }

.danger { background:#52252b; border-color:#853b44; }

.viewer {

  background:#08090b; border-radius:10px; overflow:hidden;

  display:flex; justify-content:center; align-items:center;

  min-height:220px; position:relative;

}

.viewer img {

  display:block; width:100%; height:auto; max-height:75vh;

  object-fit:contain;

}


.mic-meter { margin-top:14px; padding:14px; border:1px solid var(--line); border-radius:10px; background:#10141a; }
.mic-meter-top { display:flex; justify-content:space-between; gap:12px; margin-bottom:10px; font-size:14px; }
.mic-meter-track { height:14px; overflow:hidden; border-radius:999px; background:#303641; }
.mic-meter-bar { width:0%; height:100%; border-radius:999px; background:var(--green); transition:width .08s linear, background .15s; }
.mic-meter .hint { margin-bottom:0; }

.audio-frame {

  width: 100%;

  height: 260px;

  border: 0;

  border-radius: 8px;

  background: #08090b;

}

.hint { color:var(--muted); font-size:13px; margin-top:12px; }

.grid {

  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px;

}

input,select {

  background:#10141a; color:var(--text); border:1px solid var(--line);

  border-radius:8px; padding:10px; font:inherit;

}

.record-list { display:grid; gap:10px; }

.record-row {

  padding:12px; border:1px solid var(--line); border-radius:10px;

}

.record-name { overflow-wrap:anywhere; min-width:0; }

.record-meta { color:var(--muted); font-size:12px; }

video { display:block; width:100%; max-height:70vh; background:#050505; }

.empty { color:var(--muted); padding:18px 0; }

footer { color:var(--muted); text-align:center; font-size:12px; padding:8px; }


:root { --focus:#a8c7ff; }
html { scroll-behavior:smooth; }
body { min-height:100vh; }
header { position:sticky; top:0; z-index:20; background:rgba(16,18,22,.94); backdrop-filter:blur(12px); }
main { max-width:1180px; }
.panel { box-shadow:0 8px 28px rgba(0,0,0,.12); }
.topline { align-items:center; }
.viewer { min-height:180px; aspect-ratio:16 / 9; }
.viewer img { width:100%; height:100%; max-height:75vh; object-fit:contain; }
.viewer.is-paused::after {
  content:"預覽已暫停"; position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%); padding:8px 14px; border-radius:999px;
  background:rgba(0,0,0,.72); color:#fff; font-size:14px; pointer-events:none;
}
.control-strip { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.control-group { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.control-label { color:var(--muted); font-size:13px; }
button,.button,select { min-height:42px; }
button:focus-visible,.button:focus-visible,select:focus-visible {
  outline:2px solid var(--focus); outline-offset:2px;
}
button:active { transform:translateY(1px); }
#liveStatus { overflow-wrap:anywhere; }
.record-row { align-items:center; }
.record-row .actions { justify-content:flex-end; }
.audio-frame { max-height:260px; }
[hidden] { display:none !important; }
@media(max-width:700px) {
  main { padding:14px 10px 32px; }
  header { position:static; padding:14px; }
  h1 { font-size:17px; }
  .panel { padding:13px; border-radius:12px; margin-bottom:12px; }
  .topline { align-items:flex-start; }
  .topline > .actions { width:100%; }
  .topline > .actions button { flex:1 1 auto; }
  .viewer { min-height:150px; aspect-ratio:4 / 3; }
  .viewer img { max-height:60vh; }
  .control-strip { display:grid; grid-template-columns:1fr; }
  .control-group { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
  .control-group button,.control-group select { width:100%; }
  .actions button,.actions .button { flex:1 1 auto; text-align:center; }
  .record-row { align-items:stretch; }
  .record-row .actions { width:100%; }
  .record-row .actions > * { flex:1; text-align:center; }
  .audio-frame { height:220px; }
}
@media(prefers-reduced-motion:reduce) {
  html { scroll-behavior:auto; }
  *,*::before,*::after { transition:none !important; animation:none !important; }
}

@media(max-width:700px) {

  .grid { grid-template-columns:1fr; }

  .panel { padding:14px; }

  header { padding:16px; }

}

main {

.panel {

.audio-frame {

<script>

"use strict";



const API = "/recordings-api";

const $ = id => document.getElementById(id);



let liveRetries = 0;
let liveTimer = null;
let liveTimeoutTimer = null;
let liveHasLoaded = false;
let previewPaused = false;
let autoReconnectEnabled = true;

function setLiveStatus(online, message) {
  $("liveDot").className = "dot" + (online ? " online" : " offline");
  $("liveStatus").textContent = message;
}

function stopLiveTimers() {
  clearTimeout(liveTimer);
  clearTimeout(liveTimeoutTimer);
  liveTimer = null;
  liveTimeoutTimer = null;
}

function refreshLive() {
  stopLiveTimers();
  if (previewPaused || document.hidden) return;

  const image = $("liveImage");
  liveHasLoaded = false;
  setLiveStatus(false, "影像連線中…");

  image.onload = () => {
    if (previewPaused) return;
    if (!liveHasLoaded) {
      liveHasLoaded = true;
      clearTimeout(liveTimeoutTimer);
      liveTimeoutTimer = null;
      liveRetries = 0;
      setLiveStatus(true, "影像連線正常");
      $("liveUpdated").textContent =
        "最後更新：" + new Date().toLocaleTimeString();
    }
  };

  image.onerror = () => {
    if (previewPaused) return;
    clearTimeout(liveTimeoutTimer);
    liveTimeoutTimer = null;
    liveHasLoaded = false;
    setLiveStatus(false, "影像連線中斷");
    if (autoReconnectEnabled) scheduleLiveRetry();
  };

  liveTimeoutTimer = setTimeout(() => {
    liveTimeoutTimer = null;
    if (!liveHasLoaded && !previewPaused) {
      setLiveStatus(false, "首次連線逾時");
      if (autoReconnectEnabled) scheduleLiveRetry();
    }
  }, 12000);

  image.src = "/camera/stream?t=" + Date.now();
}

function scheduleLiveRetry() {
  if (!autoReconnectEnabled || previewPaused || liveTimer !== null) return;
  const delay = Math.min(1000 * (2 ** Math.min(liveRetries++, 5)), 15000);
  $("liveStatus").textContent = "將於 " + Math.ceil(delay / 1000) + " 秒後重試";
  liveTimer = setTimeout(() => {
    liveTimer = null;
    refreshLive();
  }, delay);
}

function pausePreview() {
  previewPaused = true;
  stopLiveTimers();
  const image = $("liveImage");
  image.onload = null;
  image.onerror = null;
  image.removeAttribute("src");
  $("liveViewer").classList.add("is-paused");
  $("pausePreview").textContent = "恢復預覽";
  $("previewState").textContent = " · 預覽暫停中";
  setLiveStatus(false, "預覽已暫停");
}

function resumePreview() {
  previewPaused = false;
  $("liveViewer").classList.remove("is-paused");
  $("pausePreview").textContent = "暫停預覽";
  $("previewState").textContent = "";
  liveRetries = 0;
  refreshLive();
}

$("pausePreview").addEventListener("click", () => {
  if (previewPaused) resumePreview();
  else pausePreview();
});

$("autoReconnect").addEventListener("click", () => {
  autoReconnectEnabled = !autoReconnectEnabled;
  $("autoReconnect").textContent = "自動重連：" + (autoReconnectEnabled ? "開" : "關");
  $("autoReconnect").setAttribute("aria-pressed", String(autoReconnectEnabled));
  if (!autoReconnectEnabled) {
    clearTimeout(liveTimer);
    liveTimer = null;
  } else if (!previewPaused && !liveHasLoaded) {
    scheduleLiveRetry();
  }
});

$("fitMode").addEventListener("change", event => {
  $("liveImage").style.objectFit = event.target.value;
});

$("refreshLive").addEventListener("click", () => {
  liveRetries = 0;
  if (previewPaused) resumePreview();
  else refreshLive();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearTimeout(liveTimer);
    liveTimer = null;
    clearTimeout(liveTimeoutTimer);
    $("liveImage").removeAttribute("src");
    liveHasLoaded = false;
  } else if (!previewPaused && !liveHasLoaded && autoReconnectEnabled) {
    scheduleLiveRetry();
  }
});







$("fullscreenBtn").addEventListener("click", async () => {

  const target = $("liveViewer");

  try {

    if (!document.fullscreenElement) await target.requestFullscreen();

    else await document.exitFullscreen();

  } catch (e) {

    alert("無法進入全螢幕：" + e.message);

  }

});



async function api(path, options = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), path === "/start" ? 30000 : 10000);
  try {
  const response = await fetch(API + path, {

    cache: "no-store",

    ...options,
    signal: options.signal || controller.signal,

    headers: {

      ...(options.body ? {"Content-Type":"application/json"} : {}),

      ...(options.headers || {})

    }

  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {

    throw new Error(data.error || data.message || ("HTTP " + response.status));

  }

  return data;
  } finally { clearTimeout(timeout); }
}



function formatBytes(bytes) {

  if (typeof bytes !== "number") return "";

  const units = ["B","KB","MB","GB","TB"];

  let i = 0, value = bytes;

  while (value >= 1024 && i < units.length - 1) {

    value /= 1024; i++;

  }

  return value.toFixed(i === 0 ? 0 : 1) + " " + units[i];

}



let statusBusy = false;
async function refreshStatus() {
  if (statusBusy || document.hidden) return;
  statusBusy = true;

  try {

    const data = await api("/status");

    const recording = Boolean(data.recording);

    $("recordStatus").textContent = recording ? "錄影中" : "未錄影";
    const motionOn = Boolean(data.motion_enabled);
    if ($("motionStatus")) $("motionStatus").textContent = motionOn ? (data.motion_detected ? "偵測到移動" : "已啟用／監測中") : "已停用";
    if ($("toggleMotion")) { $("toggleMotion").textContent = motionOn ? "動態觸發錄影：開" : "動態觸發錄影：關"; $("toggleMotion").setAttribute("aria-pressed", String(motionOn)); }

    $("recordStatus").style.color = recording ? "var(--red)" : "var(--green)";

    $("startRecord").disabled = recording;

    $("stopRecord").disabled = !recording;

    $("recordMessage").textContent =

      data.message || (recording ? "伺服器正在錄影。" : "錄影服務正常。");

  } catch (error) {

    $("recordStatus").textContent = "服務未連線";

    $("startRecord").disabled = true;

    $("stopRecord").disabled = true;

    $("recordMessage").textContent =

      "無法連線至錄影 API：" + error.message +

      "。請確認後端服務與 Nginx 轉發設定。";

  } finally { statusBusy = false; }

}



async function recordingAction(action) {

  const isStart = action === "start";

  $("startRecord").disabled = true;

  $("stopRecord").disabled = true;

  $("recordMessage").textContent = isStart ? "正在啟動錄影……" : "正在停止錄影……";



  try {

    const data = await api("/" + action, {method:"POST", body:"{}"});

    $("recordMessage").textContent = data.message || "操作已送出。";

    await refreshStatus();


  } catch (error) {

    $("recordMessage").textContent = "操作失敗：" + error.message;

    await refreshStatus();

  }

}



$("startRecord").addEventListener("click", () => recordingAction("start"));

$("stopRecord").addEventListener("click", () => recordingAction("stop"));
$("toggleMotion").addEventListener("click", async () => {
  const currentlyOn = $("toggleMotion").getAttribute("aria-pressed") !== "false";
  $("toggleMotion").disabled = true;
  try {
    const data = await api("/motion", {method:"POST", body:JSON.stringify({enabled:!currentlyOn})});
    $("recordMessage").textContent = data.message;
    await refreshStatus();
  } catch (error) { $("recordMessage").textContent = "切換移動偵測失敗：" + error.message; }
  finally { $("toggleMotion").disabled = false; }
});

$("refreshRecords").addEventListener("click", refreshStatus);





// Live-frame freeze detection.
const freezeCanvas = document.createElement("canvas");
freezeCanvas.width = 96;
freezeCanvas.height = 16;

const freezeCtx = freezeCanvas.getContext("2d", {
  willReadFrequently: true
});

let lastFrameSignature = "";
let lastFrameChangeAt = Date.now();
let freezeCheckBusy = false;
let freezeRecoveryPending = false;

function checkLiveFrame() {
  if (previewPaused || document.hidden || freezeCheckBusy) return;

  const image = $("liveImage");
  if (!image || !image.complete || image.naturalWidth === 0) return;

  freezeCheckBusy = true;

  try {
    // Sample the changing server timestamp, not a quiet room's static image.
    freezeCtx.drawImage(image, 12, 12,
      Math.min(350, image.naturalWidth - 12), Math.min(50, image.naturalHeight - 12),
      0, 0, 96, 16);

    const pixels = freezeCtx.getImageData(
      0, 0, 96, 16
    ).data;

    // Compact signature from sampled pixels.
    let signature = "";
    for (let i = 0; i < pixels.length; i += 4) {
      signature += String.fromCharCode(pixels[i]);
    }

    const now = Date.now();

    if (signature !== lastFrameSignature) {
      lastFrameSignature = signature;
      lastFrameChangeAt = now;
      freezeRecoveryPending = false;
    } else if (
      autoReconnectEnabled &&
      !freezeRecoveryPending &&
      now - lastFrameChangeAt >= 12000
    ) {
      freezeRecoveryPending = true;
      setLiveStatus(false, "偵測到畫面凍結，正在重新連線…");
      refreshLive();
    }
  } catch (error) {
    // If Safari cannot sample the image, do not trigger blind reconnects.
    console.warn("無法檢查即時影像是否凍結：", error);
  } finally {
    freezeCheckBusy = false;
  }
}

setInterval(checkLiveFrame, 3000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    lastFrameSignature = "";
    lastFrameChangeAt = Date.now();
    freezeRecoveryPending = false;

    if (!previewPaused && autoReconnectEnabled) {
      refreshLive();
    }
  }
});


refreshLive();

refreshStatus();


setInterval(() => { if (!document.hidden) refreshStatus(); }, 10000);




// Audio meter: analyze the same-origin MediaMTX player's video element.
(() => {
  const frame = document.getElementById("micFrame");
  const bar = document.getElementById("micMeterBar");
  const value = document.getElementById("micMeterValue");
  const status = document.getElementById("micMeterStatus");
  const track = document.querySelector(".mic-meter-track");
  let audioContext = null;
  let analyser = null;
  let source = null;
  let data = null;
  let raf = 0;
  let attachedVideo = null;

  function setStatus(text) {
    status.textContent = text;
  }

  function drawMeter() {
    if (!analyser || !data) return;
    analyser.getByteTimeDomainData(data);

    let sum = 0;
    for (const n of data) {
      const x = (n - 128) / 128;
      sum += x * x;
    }
    const rms = Math.sqrt(sum / data.length);
    const db = rms > 0 ? 20 * Math.log10(rms) : -Infinity;
    const percent = Math.max(0, Math.min(100, (db + 60) / 60 * 100));

    bar.style.width = percent.toFixed(1) + "%";
    bar.style.background = percent > 85 ? "var(--red)" :
                           percent > 8 ? "var(--green)" : "#7b8493";
    value.textContent = Number.isFinite(db) ? `${Math.round(percent)}% · ${db.toFixed(0)} dBFS` : "無訊號";
    track.setAttribute("aria-valuenow", String(Math.round(percent)));

    if (percent < 2) setStatus("目前音量很低，請確認麥克風及播放器是否正在播放");
    else if (percent > 85) setStatus("音量偏高，可能發生削波");
    else setStatus("正在分析播放器音訊");
    raf = requestAnimationFrame(drawMeter);
  }

  async function attach() {
    try {
      const doc = frame.contentDocument;
      const video = doc && doc.querySelector("video");
      if (!video) {
        setStatus("等待音訊播放器載入…");
        return;
      }
      if (video === attachedVideo) return;
      attachedVideo = video;

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      await audioContext.resume();

      // MediaElementSource can be created only once per media element.
      source?.disconnect();
      analyser?.disconnect();
      source = audioContext.createMediaElementSource(video);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      data = new Uint8Array(analyser.fftSize);

      source.connect(analyser);
      analyser.connect(audioContext.destination);

      setStatus("已連接播放器，等待音訊");
      cancelAnimationFrame(raf);
      drawMeter();
    } catch (err) {
      console.warn("Audio meter unavailable:", err);
      setStatus("瀏覽器不允許分析此播放器；請確認音訊播放是否正常");
    }
  }

  frame.addEventListener("load", () => {
    attachedVideo = null;
    setStatus("播放器已載入，等待音訊分析");
    setTimeout(attach, 500);
  });

  document.addEventListener("visibilitychange", () => {
    cancelAnimationFrame(raf);
    if (!document.hidden && analyser) drawMeter();
  });
  window.addEventListener("pagehide", () => {
    cancelAnimationFrame(raf);
  });

  // iOS Safari usually needs a user gesture before audio playback/context starts.
  document.addEventListener("click", () => {
    if (audioContext && audioContext.state === "suspended") {
      audioContext.resume().catch(() => {});
    }
    attach();
  });

  setStatus("等待音訊播放器載入…");
  setTimeout(attach, 1200);
})();

</script>
